<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>deck test harness</title></head>
<body>
<iframe id="f" src="reasons.html?preview" style="width:430px;height:920px;border:0"></iframe>
<pre id="log">pending</pre>
<script>
var out = [];
var el = document.getElementById("log");
function say(k, v) { out.push(k + ": " + v); el.textContent = out.join("\n"); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var f = document.getElementById("f");
f.addEventListener("load", function () { setTimeout(run, 1500); });

function run() {
  var d = f.contentDocument;
  var w = f.contentWindow;

  w.addEventListener("error", function (e) { say("IFRAME ERROR", e.message); });

  var deck = d.querySelector("[data-deck]");
  var stage = deck.parentNode;
  var count = d.querySelector("[data-deck-count]");
  var live = d.querySelector("[data-deck-live]");
  var cards = Array.prototype.slice.call(d.querySelectorAll(".deck-card"));
  var prev = d.querySelector("[data-deck-prev]");
  var next = d.querySelector("[data-deck-next]");
  var section = d.querySelector("[data-deck-section]");

  function fire(type, x, y) {
    var ev = new w.PointerEvent(type, {
      bubbles: true, cancelable: true, clientX: x, clientY: y,
      pointerId: 11, pointerType: "mouse", button: 0, buttons: 1, isPrimary: true
    });
    stage.dispatchEvent(ev);
  }

  function tx(i) {
    return cards[i].style.transform;
  }

  say("cards", cards.length);
  say("notes", d.querySelectorAll(".deck-card__note").length);
  say("front count", d.querySelectorAll(".deck-card.is-front").length);
  say("front index", cards.indexOf(d.querySelector(".deck-card.is-front")));
  say("front aria-hidden", cards[0].getAttribute("aria-hidden"));
  say("back aria-hidden", cards[1].getAttribute("aria-hidden"));
  say("count", count.textContent.trim());
  say("prev disabled", prev.disabled);
  say("next disabled", next.disabled);
  say("card0 transform", tx(0));
  say("card1 transform", tx(1));

  var rect = stage.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;

  // 1. drag left, past the threshold, then release with a little velocity
  fire("pointerdown", cx, cy);
  fire("pointermove", cx - 30, cy);
  fire("pointermove", cx - 90, cy);
  fire("pointermove", cx - 160, cy);
  fire("pointermove", cx - 230, cy);
  say("dragging class", stage.classList.contains("is-dragging"));
  say("mid-drag card0", tx(0));
  fire("pointerup", cx - 230, cy);

  wait(1500).then(function () {
    say("after drag count", count.textContent.trim());
    say("after drag front", cards.indexOf(d.querySelector(".deck-card.is-front")));
    say("after drag live", live.textContent.slice(0, 48));
    say("after drag prev disabled", prev.disabled);
    say("after drag card0 transform", tx(0));

    // 2. a vertical gesture must scroll the page, not the deck
    fire("pointerdown", cx, cy);
    fire("pointermove", cx + 6, cy - 60);
    fire("pointermove", cx + 8, cy - 120);
    fire("pointerup", cx + 8, cy - 120);
    return wait(300);
  }).then(function () {
    say("after vertical count", count.textContent.trim());
    say("after vertical dragging class", stage.classList.contains("is-dragging"));

    // 3. keyboard
    deck.dispatchEvent(new w.KeyboardEvent("keydown", { key: "ArrowRight", bubbles: true, cancelable: true }));
    return wait(1200);
  }).then(function () {
    say("after ArrowRight count", count.textContent.trim());
    say("after ArrowRight focusable", deck.getAttribute("tabindex"));

    // 4. buttons
    next.click();
    return wait(1200);
  }).then(function () {
    say("after next button count", count.textContent.trim());

    prev.click();
    return wait(1200);
  }).then(function () {
    say("after prev button count", count.textContent.trim());

    // 5. page scroll drives the fan spread, without touching the card index
    var before = tx(2);
    say("lenis", w.App && w.App.lenis ? "present" : "absent");
    say("scroll-behavior", w.getComputedStyle(d.documentElement).scrollBehavior);
    say("scrollHeight/height", d.documentElement.scrollHeight + "/" + w.innerHeight);
    var target = section.getBoundingClientRect().top + w.scrollY - 140;
    if (w.App && w.App.lenis) w.App.lenis.scrollTo(target, { immediate: true });
    else w.scrollTo(0, target);
    return wait(1400).then(function () {
      say("scroll y", Math.round(w.scrollY));
      say("card2 before scroll", before);
      say("card2 after scroll", tx(2));
      say("count after scroll", count.textContent.trim());
      say("stage drift", stage.style.transform || "(none yet)");

      // 6. drag back to the start, then past it (rubber band, no wrap)
      var r2 = stage.getBoundingClientRect();
      var x2 = r2.left + r2.width / 2;
      var y2 = r2.top + 120;
      fire("pointerdown", x2, y2);
      for (var i = 1; i <= 6; i++) fire("pointermove", x2 + i * 60, y2);
      say("rubber band card0", tx(0));
      fire("pointerup", x2 + 360, y2);
      return wait(1400);
    });
  }).then(function () {
    say("final count", count.textContent.trim());
    say("final front", cards.indexOf(d.querySelector(".deck-card.is-front")));
    say("final prev disabled", prev.disabled);
    say("is-ready", d.documentElement.classList.contains("is-ready"));
    say("DONE", "true");
  });
}
</script>
</body>
</html>
